version: "3"

# Eve Industrialist task runner. Every task mirrors the working rules in
# AGENTS.md. Run `task --list` to see them all.

vars:
  GO_TAGS: '{{.GO_TAGS | default ""}}'

tasks:
  default:
    desc: Build everything (Go + frontend typecheck)
    cmds:
      - task: build

  build:
    desc: Compile all Go packages
    cmds:
      - go build {{if .GO_TAGS}}-tags {{.GO_TAGS}}{{end}} ./...

  test:
    desc: Run the full Go test suite (no cache)
    cmds:
      - go test -count=1 ./...

  test:race:
    desc: Run the full Go test suite with the race detector
    cmds:
      - go test -race -count=1 ./...

  vet:
    desc: go vet the whole module
    cmds:
      - go vet ./...

  fmt:
    desc: Report files needing gofmt (fails if any)
    cmds:
      - |
        out=$(gofmt -l cmd internal migrations)
        if [ -n "$out" ]; then
          echo "$out"
          exit 1
        fi

  fmt:write:
    desc: Apply gofmt to the Go tree
    cmds:
      - gofmt -w cmd internal migrations

  check:
    desc: vet + gofmt check + full test suite
    cmds:
      - task: vet
      - task: fmt
      - task: test

  run:api:
    desc: Run the API server (env from environment, see README)
    cmds:
      - go run ./cmd/api

  run:worker:
    desc: Run the background job worker
    cmds:
      - go run ./cmd/worker

  run:scheduler:
    desc: Run the cron tick dispatcher
    cmds:
      - go run ./cmd/scheduler

  start:
    desc: Kill leftovers, build and start api + worker + scheduler + web UI (.run/)
    cmds:
      - |
        set -e
        mkdir -p .run/bin .run/log
        # Kill anything already running: tracked pidfiles plus orphans
        # (previous runs, crashed starts) matched by binary path.
        # NOTE: tasks run under gosh, which has no kill/jobs builtins, so
        # liveness is tested via /proc and signals go through real sh.
        # The [.] / [n] brackets keep pkill from matching this script itself.
        for svc in api worker scheduler ui; do
          if [ -f .run/$svc.pid ]; then
            pid=$(cat .run/$svc.pid)
            if [ -n "$pid" ] && [ -d "/proc/$pid" ]; then sh -c 'kill "$1" 2>/dev/null' _ "$pid" || true; fi
            rm -f .run/$svc.pid
          fi
          pkill -f "[.]run/bin/$svc" 2>/dev/null || true
        done
        pkill -f "[n]ode_modules/.bin/vite" 2>/dev/null || true
        sleep 1
        go build -o .run/bin/api ./cmd/api
        go build -o .run/bin/worker ./cmd/worker
        go build -o .run/bin/scheduler ./cmd/scheduler
        for svc in api worker scheduler; do
          nohup sh -c 'echo $$ > .run/$0.pid; exec ./.run/bin/$0' "$svc" >.run/log/$svc.log 2>&1 < /dev/null &
          sleep 0.5
          pid=$(cat .run/$svc.pid 2>/dev/null || true)
          if [ -n "$pid" ] && [ -d "/proc/$pid" ]; then
            echo "$svc started (pid $pid)"
          else
            echo "$svc failed to start:"; tail -5 .run/log/$svc.log; exit 1
          fi
        done
        port="${PORT:-8080}"
        api_pid=$(cat .run/api.pid)
        for i in $(seq 1 30); do
          if curl -fs -o /dev/null "http://localhost:$port/up" 2>/dev/null; then
            echo "api at http://localhost:$port"
            break
          fi
          if [ -z "$api_pid" ] || [ ! -d "/proc/$api_pid" ]; then
            echo "api died on startup:"; tail -10 .run/log/api.log; exit 1
          fi
          sleep 0.5
          if [ "$i" = "30" ]; then echo "api did not answer /up (see .run/log/api.log)"; exit 1; fi
        done
        # Web UI: vite dev server proxying /api to the Go api.
        ui_port="${UI_PORT:-5173}"
        if [ -x frontend/node_modules/.bin/vite ]; then
          LARAVEL_URL="http://localhost:$port" nohup sh -c 'cd frontend && echo $$ > ../.run/$0.pid; exec ./node_modules/.bin/vite --port "$1" --strictPort' ui "$ui_port" >.run/log/ui.log 2>&1 < /dev/null &
          sleep 1
          for i in $(seq 1 30); do
            if curl -fs -o /dev/null "http://localhost:$ui_port/" 2>/dev/null; then
              echo "web ui at http://localhost:$ui_port/app/"
              break
            fi
            uipid=$(cat .run/ui.pid 2>/dev/null || true)
            if [ -z "$uipid" ] || [ ! -d "/proc/$uipid" ]; then
              echo "ui failed to start (see .run/log/ui.log)"; break
            fi
            sleep 0.5
            if [ "$i" = "30" ]; then echo "ui did not answer (see .run/log/ui.log)"; fi
          done
        else
          echo "web ui skipped (npm or frontend/node_modules/.bin/vite missing)"
        fi

  stop:
    desc: Stop the background api + worker + scheduler + web UI
    cmds:
      - |
        for svc in api worker scheduler ui; do
          if [ -f .run/$svc.pid ]; then
            pid=$(cat .run/$svc.pid)
            if [ -n "$pid" ] && [ -d "/proc/$pid" ]; then
              sh -c 'kill "$1" 2>/dev/null' _ "$pid" || true
              for i in $(seq 1 20); do
                if [ -d "/proc/$pid" ]; then sleep 0.5; else break; fi
              done
              if [ -d "/proc/$pid" ]; then sh -c 'kill -9 "$1" 2>/dev/null' _ "$pid" || true; fi
              echo "$svc stopped (was $pid)"
            else
              echo "$svc not running (stale pid $pid)"
            fi
            rm -f .run/$svc.pid
          else
            echo "$svc not running"
          fi
          pkill -f "[.]run/bin/$svc" 2>/dev/null || true
        done
        pkill -f "[n]ode_modules/.bin/vite" 2>/dev/null || true

  migrate:
    desc: "Apply pending SQL migrations (usage: task migrate -- [up|down|status] [n])"
    cmds:
      - go run ./cmd/migrate {{.CLI_ARGS}}

  migrate:test:
    desc: Verify the migration chain test only
    cmds:
      - go test -count=1 ./cmd/migrate/

  frontend:install:
    desc: Install frontend dependencies
    dir: frontend
    cmds:
      - npm ci

  frontend:gen:
    desc: Regenerate the typed API client from docs/openapi.json
    dir: frontend
    cmds:
      - npm run gen:api
    sources:
      - ../docs/openapi.json
    generates:
      - src/api/schema.d.ts

  frontend:typecheck:
    desc: Strict TypeScript check (app + service worker)
    dir: frontend
    cmds:
      - npm run typecheck

  frontend:test:
    desc: Run Vitest suite once
    dir: frontend
    cmds:
      - npm run test

  frontend:build:
    desc: Typecheck + production Vite build
    dir: frontend
    cmds:
      - npm run build

  frontend:size:
    desc: size-limit budget check
    dir: frontend
    cmds:
      - npm run size

  frontend:check:
    desc: gen:api (verifies in sync) + typecheck + tests
    cmds:
      - task: frontend:gen
      - task: frontend:typecheck
      - task: frontend:test
