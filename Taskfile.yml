version: "3"
output: prefixed
silent: false
vars:
  GO_TAGS: '{{.GO_TAGS | default ""}}'
tasks:
  install:
    desc: Install Go modules and frontend dependencies
    cmds:
      - cmd: go mod download
      - cmd: npm --prefix frontend ci
      - cmd: go build {{if .GO_TAGS}}-tags {{.GO_TAGS}}{{end}} ./...
  update:
    desc: Update Go and frontend dependencies
    cmds:
      - cmd: go get -u ./... && go mod tidy
      - cmd: npm --prefix frontend update
  remove:
    desc: Remove build outputs and ephemeral run files
    cmds:
      - cmd: rm -rf .run/bin .run/log .run/*.pid frontend/node_modules logs/test/app.jsonl logs/errors/app.jsonl public/app
  setup:
    desc: Bootstrap fresh checkout
    dotenv:
      - .env
    cmds:
      - cmd: '[ -f .env ] || cp .env.example .env'
      - task: install
      - cmd: go run ./cmd/migrate up
      - cmd: go run ./cmd/job sde-import
      - cmd: DEMO_ENABLED="${DEMO_ENABLED:-true}" go run ./cmd/job demo-reset
  migrate:
    desc: Apply SQL migrations
    dotenv:
      - .env
    cmds:
      - cmd: go run ./cmd/migrate {{.CLI_ARGS}}
  start:
    desc: Build and start api worker scheduler ui
    dotenv:
      - .env
    cmds:
      - cmd: mkdir -p .run/bin .run/log logs/test logs/errors
      - cmd: for svc in api worker scheduler ui; do if [ -f .run/$svc.pid ]; then pid=$(cat .run/$svc.pid 2>/dev/null || true); if [ -n "$pid" ] && [ -d "/proc/$pid" ]; then kill "$pid" 2>/dev/null || true; fi; rm -f .run/$svc.pid; fi; pkill -f "[.]run/bin/$svc" 2>/dev/null || true; done; pkill -f "[n]ode_modules/.bin/vite" 2>/dev/null || true
      - cmd: go build -o .run/bin/api ./cmd/api
      - cmd: go build -o .run/bin/worker ./cmd/worker
      - cmd: go build -o .run/bin/scheduler ./cmd/scheduler
      - cmd: go run ./cmd/migrate up
      - cmd: DEMO_ENABLED="${DEMO_ENABLED:-true}"; export DEMO_ENABLED; for svc in api worker scheduler; do nohup sh -c 'echo $$ > .run/$0.pid; exec ./.run/bin/$0' "$svc" >.run/log/$svc.log 2>&1 < /dev/null & echo "$svc started"; done
      - cmd: port="${PORT:-8080}"; curl -fs --retry 60 --retry-delay 1 --retry-all-errors -o /dev/null "http://localhost:$port/up" && echo "api started at http://localhost:$port" || { echo "api did not answer /up yet (see .run/log/api.log)"; exit 1; }
      - cmd: port="${PORT:-8080}"; ui_port="${UI_PORT:-5173}"; if [ -x frontend/node_modules/.bin/vite ]; then LARAVEL_URL="http://localhost:$port" nohup sh -c 'cd frontend && echo $$ > ../.run/$0.pid; exec ./node_modules/.bin/vite --port "$1" --strictPort' ui "$ui_port" >.run/log/ui.log 2>&1 < /dev/null & curl -fs --retry 60 --retry-delay 1 --retry-all-errors -o /dev/null "http://localhost:$ui_port/app/" && echo "web ui started at http://localhost:$ui_port/app/" || { echo "web ui did not answer yet (see .run/log/ui.log)"; exit 1; }; else echo "web ui missing (run task install first)"; exit 1; fi
  stop:
    desc: Stop background api worker scheduler ui
    cmds:
      - cmd: for svc in api worker scheduler ui; do if [ -f .run/$svc.pid ]; then pid=$(cat .run/$svc.pid 2>/dev/null || true); if [ -n "$pid" ] && [ -d "/proc/$pid" ]; then kill "$pid" 2>/dev/null || true; echo "$svc stopped (was $pid)"; else echo "$svc not running (stale pid $pid)"; fi; rm -f .run/$svc.pid; else echo "$svc not running"; fi; pkill -f "[.]run/bin/$svc" 2>/dev/null || true; done; pkill -f "[n]ode_modules/.bin/vite" 2>/dev/null || true
  dev:
    desc: Run api and web UI for local development
    dotenv:
      - .env
    cmds:
      - cmd: mkdir -p logs/test logs/errors
      - cmd: sh -c 'trap "kill \$api \$ui 2>/dev/null" EXIT INT TERM; DEMO_ENABLED="${DEMO_ENABLED:-true}" go run ./cmd/api & api=$!; (cd frontend && LARAVEL_URL="http://localhost:${PORT:-8080}" exec npm run dev -- --port "${UI_PORT:-5173}" --strictPort) & ui=$!; wait'
